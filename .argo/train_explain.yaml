apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
    generateName: train-and-explain-
spec:
    entrypoint: pipeline
    podFailurePolicy:
      rule: Fail

    arguments:
        parameters:
            - name: image
              value: "electera:latest"
            - name: bt_data_path
              value: ""
            - name: bt_dataset_path
              value: ""
            - name: bt_models
              value: ""
            - name: bt_k_year
              value: ""
            - name: bt_k_type
              value: ""
            - name: bt_political_trends
              value: ""
            - name: bt_predict_delta
              value: ""
            - name: bt_predict_percentile
              value: ""
            - name: bt_organize_vote
              value: ""
            - name: bt_use_mlflow
              value: ""
            - name: bt_version
              value: ""
            - name: ex_model_version
              value: ""
            - name: ex_years
              value: ""
            - name: ex_types
              value: ""
            - name: ex_vars
              value: ""
            - name: ex_data_path
              value: ""
            - name: ex_steps
              value: ""
            - name: aws_access_key_id
              value: ""
            - name: aws_secret_access_key
              value: ""
            - name: mlflow_username
              value: ""
            - name: mlflow_password
              value: ""

    templates:
    - name: pipeline
      steps:
        - - name: generate-backtest-params
            template: generate-params
            arguments:
              parameters: [{name: mode, value: "backtest"}]
        - - name: train
            template: train
            arguments:
              parameters:
                - name: param
                  value: "{{item}}"
            withItems: "{{steps.generate-backtest-params.outputs.result}}"
        - - name: generate-explain-params
            template: generate-params
            arguments:
              parameters: [{name: mode, value: "explain"}]
        - - name: explain
            template: explain
            arguments:
              parameters:
                - name: param
                  value: "{{item}}"
            withItems: "{{steps.generate-explain-params.outputs.result}}"

    - name: generate-params
      inputs:
        parameters:
          - name: mode
      container:
        image: "{{workflow.parameters.image}}"
        command: ["uv", "run", "python", "-m", "electera.components.utils.dispatch_argo_workflows"]
        args: ["{{inputs.parameters.mode}}"]

    - name: train
      inputs:
        parameters:
          - name: param
      container:
        image: "{{workflow.parameters.image}}"
        env:
            - name: AWS_ACCESS_KEY_ID
              value: "{{workflow.parameters.aws_access_key_id}}"
            - name: AWS_SECRET_ACCESS_KEY
              value: "{{workflow.parameters.aws_secret_access_key}}"
            - name: MLFLOW_TRACKING_USERNAME
              value: "{{workflow.parameters.mlflow_username}}"
            - name: MLFLOW_TRACKING_PASSWORD
              value: "{{workflow.parameters.mlflow_password}}"
        command: ["/bin/sh", "-c"]
        args:
          - |
            # Parse the JSON param: {"models": [...], "political_trends": [...], "k_type": [...], "k_year": {...}}
            PARAM_JSON='{{inputs.parameters.param}}'
            MODELS=$(echo $PARAM_JSON | jq -c '.models')
            TRENDS=$(echo $PARAM_JSON | jq -c '.political_trends')
            TYPE=$(echo $PARAM_JSON | jq -c '.k_type')
            YEAR=$(echo $PARAM_JSON | jq -c '.k_year')

            CMD="uv run python -m electera.cli backtest"
            [ -n "{{workflow.parameters.bt_data_path}}" ] && CMD="$CMD --data-path {{workflow.parameters.bt_data_path}}"
            [ -n "{{workflow.parameters.bt_dataset_path}}" ] && CMD="$CMD --dataset-path {{workflow.parameters.bt_dataset_path}}"
            [ -n "{{workflow.parameters.bt_models}}" ] && CMD="$CMD --models '{{workflow.parameters.bt_models}}'"
            [ -n "{{workflow.parameters.bt_k_year}}" ] && CMD="$CMD --k-year '{{workflow.parameters.bt_k_year}}'"
            [ -n "{{workflow.parameters.bt_k_type}}" ] && CMD="$CMD --k-type '{{workflow.parameters.bt_k_type}}'"
            [ -n "{{workflow.parameters.bt_political_trends}}" ] && CMD="$CMD --political-trends '{{workflow.parameters.bt_political_trends}}'"
            [ -n "{{workflow.parameters.bt_predict_delta}}" ] && CMD="$CMD --predict-delta {{workflow.parameters.bt_predict_delta}}"
            [ -n "{{workflow.parameters.bt_predict_percentile}}" ] && CMD="$CMD --predict-percentile {{workflow.parameters.bt_predict_percentile}}"
            [ -n "{{workflow.parameters.bt_organize_vote}}" ] && CMD="$CMD --organize-vote {{workflow.parameters.bt_organize_vote}}"
            [ -n "{{workflow.parameters.bt_use_mlflow}}" ] && CMD="$CMD --use-mlflow {{workflow.parameters.bt_use_mlflow}}"
            [ -n "{{workflow.parameters.bt_version}}" ] && CMD="$CMD --version {{workflow.parameters.bt_version}}"

            # Force the fan-out parameters
            CMD="$CMD --models '$MODELS' --political-trends '$TRENDS' --k-type '$TYPE' --k-year '$YEAR'"
            $CMD

    - name: explain
      inputs:
        parameters:
          - name: param
      container:
        image: "{{workflow.parameters.image}}"
        env:
            - name: AWS_ACCESS_KEY_ID
              value: "{{workflow.parameters.aws_access_key_id}}"
            - name: AWS_SECRET_ACCESS_KEY
              value: "{{workflow.parameters.aws_secret_access_key}}"
            - name: MLFLOW_TRACKING_USERNAME
              value: "{{workflow.parameters.mlflow_username}}"
            - name: MLFLOW_TRACKING_PASSWORD
              value: "{{workflow.parameters.mlflow_password}}"
        command: ["/bin/sh", "-c"]
        args:
          - |
            # Parse the JSON param: {"types": [...], "years": {...}, "vars_": [...]}
            PARAM_JSON='{{inputs.parameters.param}}'
            TYPE=$(echo $PARAM_JSON | jq -c '.types')
            YEAR=$(echo $PARAM_JSON | jq -c '.years')
            VARS=$(echo $PARAM_JSON | jq -c '.vars_')

            CMD="uv run python -m electera.cli explain"
            [ -n "{{workflow.parameters.ex_model_version}}" ] && CMD="$CMD --model-version {{workflow.parameters.ex_model_version}}"
            [ -n "{{workflow.parameters.ex_years}}" ] && CMD="$CMD --years '{{workflow.parameters.ex_years}}'"
            [ -n "{{workflow.parameters.ex_types}}" ] && CMD="$CMD --types '{{workflow.parameters.ex_types}}'"
            [ -n "{{workflow.parameters.ex_vars}}" ] && CMD="$CMD --vars '{{workflow.parameters.ex_vars}}'"
            [ -n "{{workflow.parameters.ex_data_path}}" ] && CMD="$CMD --data-path {{workflow.parameters.ex_data_path}}"
            [ -n "{{workflow.parameters.ex_steps}}" ] && CMD="$CMD --steps '{{workflow.parameters.ex_steps}}'"

            # Force the fan-out parameters
            CMD="$CMD --types '$TYPE' --years '$YEAR' --vars '$VARS'"
            $CMD
