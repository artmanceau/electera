apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
    generateName: train-and-explain-   # Argo will append a timestamp

spec:
    entrypoint: pipeline
    podFailurePolicy:
      rule: Fail
    templates:
    - name: pipeline
      steps:
        # --- train -------------------------------------------------------
        - - name: train
            template: train
        # --- explain ----------------------------------------------------
        - - name: explain
            template: explain

    # ------------------------------------------------------------------
    # Individual steps --------------------------------------------------
    # ------------------------------------------------------------------
    - name: train
      container:
        image: "{{workflow.parameters.image}}"
        command: ["uv", "run", "python", "-m", "electera.pipeline.election_backtester"]
        args:

    - name: explain
      container:
        image: "{{workflow.parameters.image}}"
        command: ["uv", "run", "python", "-m", "electera.pipeline.explain_model"]
        args:
