apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: train-explain-
  namespace: user-arthurmanceau   # pin so UI/CLI submit never hits "resource name may not be empty"
spec:
  entrypoint: pipeline
  serviceAccountName: workflow

  # Bound how long the creds-bearing Workflow object survives after it finishes.
  ttlStrategy:
    secondsAfterCompletion: 1800
  podGC:
    strategy: OnWorkflowCompletion

  arguments:
    parameters:
      - { name: image, value: "arthurmanceau/electera:latest" }

      # ---- Credentials (secrets stay empty here; supply at submit) ----
      - { name: mlflow_tracking_uri, value: "" }
      - { name: mlflow_username, value: "" }
      - { name: mlflow_password, value: "" }
      - { name: aws_access_key_id, value: "" }
      - { name: aws_secret_access_key, value: "" }
      - { name: aws_session_token, value: "" }   # required for temporary (STS) creds
      - { name: aws_region, value: "us-east-1" }
      - { name: aws_s3_endpoint, value: "minio.lab.sspcloud.fr" }

      # ---- Fan-out lists: Argo runs ONE parallel pod per array element. ----
      # Default [{}] => a single pod with an empty item => the CLI is launched
      # with no overrides => the image's default config is used.
      # To parallelize, pass an array of combination objects; each element
      # becomes its own pod.
      #   backtest_items element:
      #     {"models":["boosting"],"k_type":["presidentielle"],
      #      "k_year":{"presidentielle":[2017]},"political_trends":[["left"]]}
      #   explain_items element:
      #     {"types":["presidentielle"],"years":{"presidentielle":[2017]},
      #      "vars_":[["left"]]}
      - { name: backtest_items, value: "[{}]" }
      - { name: explain_items, value: "[{}]" }

      # ---- Shared / global execution (applied to every pod) ----
      - { name: version, value: "" }            # backtest --version AND explain --model-version
      - { name: mlflow_experiment, value: "" }

      # ---- Backtester-specific ----
      - { name: bt_data_path, value: "" }
      - { name: bt_dataset_path, value: "" }
      - { name: bt_predict_delta, value: "" }
      - { name: bt_predict_percentile, value: "" }
      - { name: bt_organize_vote, value: "" }
      - { name: bt_use_mlflow, value: "" }

      # ---- Explainer-specific ----
      - { name: ex_data_path, value: "" }
      - { name: ex_steps, value: "" }

  templates:
    # Native fan-out: train over backtest_items, then explain over explain_items.
    # Step groups run sequentially, so explain starts only after training.
    - name: pipeline
      steps:
        - - name: train
            template: train
            arguments:
              parameters:
                - name: param
                  value: "{{item}}"
            withParam: "{{workflow.parameters.backtest_items}}"
        - - name: explain
            template: explain
            arguments:
              parameters:
                - name: param
                  value: "{{item}}"
            withParam: "{{workflow.parameters.explain_items}}"

    - name: train
      inputs:
        parameters:
          - name: param
      container:
        image: "{{workflow.parameters.image}}"
        imagePullPolicy: Always
        # Every workflow input is exposed as an env var — the script reads $VARS,
        # never {{...}}, so nothing from input is ever parsed as shell code.
        env: &job_env
          - { name: PARAM_JSON, value: "{{inputs.parameters.param}}" }
          - { name: MLFLOW_TRACKING_URI, value: "{{workflow.parameters.mlflow_tracking_uri}}" }
          - { name: MLFLOW_TRACKING_USERNAME, value: "{{workflow.parameters.mlflow_username}}" }
          - { name: MLFLOW_TRACKING_PASSWORD, value: "{{workflow.parameters.mlflow_password}}" }
          - { name: AWS_ACCESS_KEY_ID, value: "{{workflow.parameters.aws_access_key_id}}" }
          - { name: AWS_SECRET_ACCESS_KEY, value: "{{workflow.parameters.aws_secret_access_key}}" }
          - { name: AWS_SESSION_TOKEN, value: "{{workflow.parameters.aws_session_token}}" }
          - { name: AWS_DEFAULT_REGION, value: "{{workflow.parameters.aws_region}}" }
          - { name: AWS_REGION, value: "{{workflow.parameters.aws_region}}" }
          # Endpoint for MinIO. s3fs/boto3 (zero-arg) read AWS_ENDPOINT_URL_S3
          # (botocore >= 1.31); MLflow reads MLFLOW_S3_ENDPOINT_URL. AWS_S3_ENDPOINT
          # (host, no scheme) is kept for Onyxia-style tools that expect it.
          - { name: AWS_S3_ENDPOINT, value: "{{workflow.parameters.aws_s3_endpoint}}" }
          - { name: AWS_ENDPOINT_URL, value: "https://{{workflow.parameters.aws_s3_endpoint}}" }
          - { name: AWS_ENDPOINT_URL_S3, value: "https://{{workflow.parameters.aws_s3_endpoint}}" }
          - { name: MLFLOW_S3_ENDPOINT_URL, value: "https://{{workflow.parameters.aws_s3_endpoint}}" }
          - { name: VERSION, value: "{{workflow.parameters.version}}" }
          - { name: MLFLOW_EXPERIMENT, value: "{{workflow.parameters.mlflow_experiment}}" }
          - { name: BT_DATA_PATH, value: "{{workflow.parameters.bt_data_path}}" }
          - { name: BT_DATASET_PATH, value: "{{workflow.parameters.bt_dataset_path}}" }
          - { name: BT_PREDICT_DELTA, value: "{{workflow.parameters.bt_predict_delta}}" }
          - { name: BT_PREDICT_PERCENTILE, value: "{{workflow.parameters.bt_predict_percentile}}" }
          - { name: BT_ORGANIZE_VOTE, value: "{{workflow.parameters.bt_organize_vote}}" }
          - { name: BT_USE_MLFLOW, value: "{{workflow.parameters.bt_use_mlflow}}" }
          - { name: EX_DATA_PATH, value: "{{workflow.parameters.ex_data_path}}" }
          - { name: EX_STEPS, value: "{{workflow.parameters.ex_steps}}" }
        command: ["/bin/sh", "-c"]
        args:
          - |
            # Polars' cloud credential provider calls boto3, which raises
            # ProfileNotFound unless a [default] profile SECTION exists. Materialize
            # a minimal one; the creds themselves still come from the AWS_* env vars.
            export AWS_CONFIG_FILE=/tmp/aws-config
            printf '[default]\nregion = %s\n' "${AWS_DEFAULT_REGION:-us-east-1}" > "$AWS_CONFIG_FILE"

            # Build argv safely (no eval): a flag is added only when its value is set.
            # PARAM_JSON is {} for a bare default run, or one combination object.
            set -- backtest
            [ -n "$BT_DATA_PATH" ]          && set -- "$@" --data-path "$BT_DATA_PATH"
            [ -n "$BT_DATASET_PATH" ]       && set -- "$@" --dataset-path "$BT_DATASET_PATH"
            [ -n "$BT_PREDICT_DELTA" ]      && set -- "$@" --predict-delta "$BT_PREDICT_DELTA"
            [ -n "$BT_PREDICT_PERCENTILE" ] && set -- "$@" --predict-percentile "$BT_PREDICT_PERCENTILE"
            [ -n "$BT_ORGANIZE_VOTE" ]      && set -- "$@" --organize-vote "$BT_ORGANIZE_VOTE"
            [ -n "$BT_USE_MLFLOW" ]         && set -- "$@" --use-mlflow "$BT_USE_MLFLOW"
            [ -n "$VERSION" ]               && set -- "$@" --version "$VERSION"

            EXPERIMENT=$(echo "$PARAM_JSON" | jq -r '.mlflow_experiment // empty')
            [ -z "$EXPERIMENT" ] && EXPERIMENT="$MLFLOW_EXPERIMENT"
            [ -n "$EXPERIMENT" ] && set -- "$@" --mlflow-experiment "$EXPERIMENT"

            # Per-combo slice (skipped when the item is {}).
            MODELS=$(echo "$PARAM_JSON" | jq -c '.models // empty')
            [ -n "$MODELS" ] && set -- "$@" --models "$MODELS"
            TRENDS=$(echo "$PARAM_JSON" | jq -c '.political_trends // empty')
            [ -n "$TRENDS" ] && set -- "$@" --political-trends "$TRENDS"
            TYPE=$(echo "$PARAM_JSON" | jq -c '.k_type // empty')
            [ -n "$TYPE" ] && set -- "$@" --k-type "$TYPE"
            YEAR=$(echo "$PARAM_JSON" | jq -c '.k_year // empty')
            [ -n "$YEAR" ] && set -- "$@" --k-year "$YEAR"

            echo "+ electera.cli $*" >&2
            exec uv run python -m electera.cli "$@"

    - name: explain
      inputs:
        parameters:
          - name: param
      container:
        image: "{{workflow.parameters.image}}"
        imagePullPolicy: Always
        env: *job_env
        command: ["/bin/sh", "-c"]
        args:
          - |
            # See train: give boto3 a [default] profile so Polars' credential
            # provider doesn't raise ProfileNotFound. Creds come from AWS_* env.
            export AWS_CONFIG_FILE=/tmp/aws-config
            printf '[default]\nregion = %s\n' "${AWS_DEFAULT_REGION:-us-east-1}" > "$AWS_CONFIG_FILE"

            set -- explain
            [ -n "$VERSION" ]      && set -- "$@" --model-version "$VERSION"
            [ -n "$EX_DATA_PATH" ] && set -- "$@" --data-path "$EX_DATA_PATH"
            [ -n "$EX_STEPS" ]     && set -- "$@" --steps "$EX_STEPS"

            # Per-combo slice (skipped when the item is {}).
            TYPE=$(echo "$PARAM_JSON" | jq -c '.types // empty')
            [ -n "$TYPE" ] && set -- "$@" --types "$TYPE"
            YEAR=$(echo "$PARAM_JSON" | jq -c '.years // empty')
            [ -n "$YEAR" ] && set -- "$@" --years "$YEAR"
            VARS=$(echo "$PARAM_JSON" | jq -c '.vars_ // empty')
            [ -n "$VARS" ] && set -- "$@" --vars "$VARS"

            echo "+ electera.cli $*" >&2
            exec uv run python -m electera.cli "$@"
