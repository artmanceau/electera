          - name: VERSION
            value: "{{workflow.parameters.version}}"
          - name: MLFLOW_TRACKING_URI
            value: "{{workflow.parameters.mlflow_tracking_uri}}"
          - name: MLFLOW_EXPERIMENT_NAME
            value: "{{workflow.parameters.mlflow_experiment}}"
          - name: MLFLOW_TRACKING_USERNAME
            value: "{{workflow.parameters.mlflow_username}}"
          - name: MLFLOW_TRACKING_PASSWORD
            value: "{{workflow.parameters.mlflow_password}}"
          - name: AWS_DEFAULT_REGION
            value: us-east-1
          - name: AWS_S3_ENDPOINT
            value: "{{workflow.parameters.aws_s3_endpoint}}"
          - name: AWS_ENDPOINT_URL
            value: https://{{workflow.parameters.aws_s3_endpoint}}
          - name: AWS_ACCESS_KEY_ID
            value: "{{workflow.parameters.aws_access_key_id}}"
          - name: AWS_SECRET_ACCESS_KEY
            value: "{{workflow.parameters.aws_secret_access_key}}"
          - name: AWS_SESSION_TOKEN
            value: "{{workflow.parameters.aws_session_token}}"
        resources:
          limits:
            cpu: "8"
            memory: 96Gi
          requests:
            cpu: "4"
            memory: 32Gi
        imagePullPolicy: Always
      retryStrategy:
        limit: "2"
        retryPolicy: OnError
    - name: explain
