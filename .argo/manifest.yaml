spec:
  templates:
    - name: main
      inputs: {}
      outputs: {}
      metadata: {}
      steps:
        - - name: build-matrix
            template: build-matrix
            arguments: {}
        - - name: train-explain
            template: train-explain
            arguments:
              parameters:
                - name: type
                  value: "{{item.type}}"
                - name: year
                  value: "{{item.year}}"
                - name: trend_csv
                  value: "{{item.trend_csv}}"
                - name: combo_id
                  value: "{{item.combo_id}}"
            withParam: "{{steps.build-matrix.outputs.result}}"
    - name: build-matrix
      inputs: {}
      outputs: {}
      metadata: {}
      script:
        name: ""
        image: "{{workflow.parameters.image}}"
        command:
          - uv
          - run
          - --no-sync
          - python
        workingDir: "{{workflow.parameters.workdir}}"
        resources: {}
        imagePullPolicy: Always
        source: >
          import json

          k_type = json.loads(r'''{{workflow.parameters.k_type}}''')

          k_year = json.loads(r'''{{workflow.parameters.k_year}}''')

          trends = json.loads(r'''{{workflow.parameters.political_trends}}''')

          combos = []

          for t in k_type:
              for y in k_year.get(t, []):
                  for i, trend_set in enumerate(trends):
                      combos.append({
                          "type": t,                        # e.g. leg          (no quotes)
                          "year": str(y),                   # e.g. 2022         (no quotes)
                          "trend_csv": ",".join(trend_set), # e.g. taupar,tauD  (no quotes)
                          "combo_id": f"{t}-{y}-t{i}",
                      })
          print(json.dumps(combos))
    - name: train-explain
      inputs:
        parameters:
          - name: type
          - name: year
          - name: trend_csv
          - name: combo_id
      outputs: {}
      metadata: {}
      dag:
        tasks:
          - name: backtest
            template: backtest
            arguments:
              parameters:
                - name: type
                  value: "{{inputs.parameters.type}}"
                - name: year
                  value: "{{inputs.parameters.year}}"
                - name: trend_csv
                  value: "{{inputs.parameters.trend_csv}}"
                - name: combo_id
                  value: "{{inputs.parameters.combo_id}}"
          - name: explain
            template: explain
            arguments:
              parameters:
                - name: type
                  value: "{{inputs.parameters.type}}"
                - name: year
                  value: "{{inputs.parameters.year}}"
                - name: trend_csv
                  value: "{{inputs.parameters.trend_csv}}"
                - name: combo_id
                  value: "{{inputs.parameters.combo_id}}"
            dependencies:
              - backtest
    - name: backtest
      inputs:
        parameters:
          - name: type
          - name: year
          - name: trend_csv
          - name: combo_id
      outputs: {}
      metadata:
        labels:
          app: electera
          combo: "{{inputs.parameters.combo_id}}"
          stage: backtest
      container:
        name: ""
        image: "{{workflow.parameters.image}}"
        command:
          - sh
          - -c
        args:
          - >
            set -eu

            # Write the [default] AWS/MinIO profile from the workflow params

            mkdir -p "$HOME/.aws"

            {
              echo "[default]"
              echo "aws_access_key_id=$AWS_ACCESS_KEY_ID"
              echo "aws_secret_access_key=$AWS_SECRET_ACCESS_KEY"
              [ -n "$AWS_SESSION_TOKEN" ] && echo "aws_session_token=$AWS_SESSION_TOKEN"
            } > "$HOME/.aws/credentials"

            { echo "[default]"; echo "region=$AWS_DEFAULT_REGION"; echo
            "output=json"; } > "$HOME/.aws/config"


            # Rebuild JSON args in-shell (Argo escapes quotes inside withParam
            item values)

            K_TYPE_JSON="[\"$TYPE\"]"                 # ["leg"]

            K_YEAR_JSON="{\"$TYPE\": [$YEAR]}"        # {"leg": [2022]}

            TRENDS_JSON="[["

            IFS=,; first=1

            for tok in $TREND_CSV; do
              if [ "$first" = 1 ]; then first=0; else TRENDS_JSON="$TRENDS_JSON,"; fi
              TRENDS_JSON="$TRENDS_JSON\"$tok\""
            done

            unset IFS

            TRENDS_JSON="$TRENDS_JSON]]"             #
            [["taupar","tauD","tauG","tauCGCCD"]]

            echo "==> k_type=$K_TYPE_JSON k_year=$K_YEAR_JSON
            trends=$TRENDS_JSON"


            uv run --no-sync python -m "$ENTRYPOINT_MODULE" backtest \
              --data-path "$DATA_PATH" \
              --dataset-path "$DATASET_PATH" \
              --models "$MODELS" \
              --k-type "$K_TYPE_JSON" \
              --k-year "$K_YEAR_JSON" \
              --political-trends "$TRENDS_JSON" \
              --predict-delta "$PREDICT_DELTA" \
              --predict-percentile "$PREDICT_PERCENTILE" \
              --organize-vote "$ORGANIZE_VOTE" \
              --use-mlflow "$USE_MLFLOW" \
              --version "$VERSION" \
              ${MLFLOW_EXPERIMENT_NAME:+--mlflow-experiment "$MLFLOW_EXPERIMENT_NAME"}
        workingDir: "{{workflow.parameters.workdir}}"
        env:
          - name: ENTRYPOINT_MODULE
            value: "{{workflow.parameters.entrypoint_module}}"
          - name: TYPE
            value: "{{inputs.parameters.type}}"
          - name: YEAR
            value: "{{inputs.parameters.year}}"
          - name: TREND_CSV
            value: "{{inputs.parameters.trend_csv}}"
          - name: COMBO_ID
            value: "{{inputs.parameters.combo_id}}"
          - name: DATA_PATH
