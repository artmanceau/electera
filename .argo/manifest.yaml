            "output=json"; } > "$HOME/.aws/config"


            # Rebuild JSON args in-shell (Argo escapes quotes inside withParam
            item values)

            K_TYPE_JSON="[\"$TYPE\"]"

            K_YEAR_JSON="{\"$TYPE\": [$YEAR]}"

            TRENDS_JSON="[["

            IFS=,; first=1

            for tok in $TREND_CSV; do
              if [ "$first" = 1 ]; then first=0; else TRENDS_JSON="$TRENDS_JSON,"; fi
              TRENDS_JSON="$TRENDS_JSON\"$tok\""
            done

            unset IFS

            TRENDS_JSON="$TRENDS_JSON]]"

            echo "==> types=$K_TYPE_JSON years=$K_YEAR_JSON vars=$TRENDS_JSON"


            uv run --no-sync python -m "$ENTRYPOINT_MODULE" explain \
              --types "$K_TYPE_JSON" \
              --years "$K_YEAR_JSON" \
              --vars "$TRENDS_JSON" \
              --data-path "$DATA_PATH" \
              --model-version "$VERSION" \
              ${EXPLAIN_STEPS:+--steps "$EXPLAIN_STEPS"}
        workingDir: "{{workflow.parameters.workdir}}"
        env:
          - name: ENTRYPOINT_MODULE
            value: "{{workflow.parameters.entrypoint_module}}"
          - name: TYPE
            value: "{{inputs.parameters.type}}"
          - name: YEAR
