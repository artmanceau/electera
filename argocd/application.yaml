apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: electera
  namespace: user-arthurmanceau
spec:
  project: default
  source:
    repoURL: https://github.com/artmanceau/electera.git
    targetRevision: main
    path: deployment
  destination:
    server: https://kubernetes.default.svc
    namespace: user-arthurmanceau
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=false