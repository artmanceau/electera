apiVersion: apps/v1
kind: Deployment
metadata:
  name: electera-api
  labels:
    app: electera-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: electera-api

  template:
    metadata:
      labels:
        app: electera-api

    spec:
      containers:
        - name: electera-api
          image: arthurmanceau/electera-api:9aa37da1e1145bea9ae4a38583e8a4af5fd6948f

          ports:
            - containerPort: 8000

          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: electera-s3
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: electera-s3
                  key: AWS_SECRET_ACCESS_KEY
