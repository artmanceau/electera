apiVersion: apps/v1
kind: Deployment
metadata:
  name: electera-api
  labels:
    app: electera-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: electera-api

  template:
    metadata:
      labels:
        app: electera-api

    spec:
      containers:
        - name: electera-api
          image: arthurmanceau/electera-api:5d04cf7366131da41e849f288bb17586110a6847

          ports:
            - containerPort: 8000

          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: electera-s3
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: electera-s3
                  key: AWS_SECRET_ACCESS_KEY
