
name: Train & Explain pipelines

on:
    workflow_dispatch:
      inputs:
        bt_data_path:
          description: 'Override data_path'
          required: false
        bt_dataset_path:
          description: 'Override dataset_path'
          required: false
        bt_models:
          description: 'Override models (JSON list, e.g. ["boosting"])'
          required: false
        bt_k_year:
          description: 'Override k_year (JSON dict)'
          required: false
        bt_k_type:
          description: 'Override k_type (JSON list)'
          required: false
        bt_political_trends:
          description: 'Override political_trends (JSON list of lists)'
          required: false
        bt_predict_delta:
          description: 'Override predict_delta (true/false)'
          required: false
        bt_predict_percentile:
          description: 'Override predict_percentile (true/false)'
          required: false
        bt_organize_vote:
          description: 'Override organize_vote (true/false)'
          required: false
        bt_use_mlflow:
          description: 'Override use_mlflow (true/false)'
          required: false
        bt_version:
          description: 'Override version'
          required: false

        # Explainer overrides
        ex_model_version:
          description: 'Override model_version'
          required: false
        ex_years:
          description: 'Override years (JSON dict)'
          required: false
        ex_types:
          description: 'Override types (JSON list)'
          required: false
        ex_vars:
          description: 'Override vars_ (JSON list of lists)'
          required: false
        ex_data_path:
          description: 'Override data_path'
          required: false
        ex_steps:
          description: 'Override steps (JSON list)'
          required: false

jobs:
    run-argo:
      runs-on: ubuntu-latest
      environment: production

      env:
        IMAGE_TAG: electera:latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Login to Docker Hub
          if: ${{ vars.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN }}
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
        - name: Pull image
          run: docker pull ${{ env.IMAGE_TAG }}

        - uses: azure/setup-kubectl@v4
          with:
            version: 'v1.30.0'

        - name: Install Argo CLI
          run: |
            curl -sLO https://github.com/argoproj/argo-workflows/releases/download/v3.12.1/argo-linux-amd64
            sudo mv argo-linux-amd64 /usr/local/bin/argo
            chmod +x /usr/local/bin/argo

        - name: Set up kubeconfig
          run: |
            mkdir -p $HOME/.kube
            echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
            chmod 600 $HOME/.kube/config

        - name: Submit Argo workflow
          run: |
            # Build parameters string
            PARAMS=""
            PARAMS+="-p image=${{ env.IMAGE_TAG }}"

            # Backtester params
            [ -n "${{ github.event.inputs.bt_data_path }}" ] && PARAMS+=" -p bt_data_path=${{ github.event.inputs.bt_data_path }}"
            [ -n "${{ github.event.inputs.bt_dataset_path }}" ] && PARAMS+=" -p bt_dataset_path=${{ github.event.inputs.bt_dataset_path }}"
            [ -n "${{ github.event.inputs.bt_models }}" ] && PARAMS+=" -p bt_models=${{ github.event.inputs.bt_models }}"
            [ -n "${{ github.event.inputs.bt_k_year }}" ] && PARAMS+=" -p bt_k_year=${{ github.event.inputs.bt_k_year }}"
            [ -n "${{ github.event.inputs.bt_k_type }}" ] && PARAMS+=" -p bt_k_type=${{ github.event.inputs.bt_k_type }}"
            [ -n "${{ github.event.inputs.bt_political_trends }}" ] && PARAMS+=" -p bt_political_trends=${{ github.event.inputs.bt_political_trends }}"
            [ -n "${{ github.event.inputs.bt_predict_delta }}" ] && PARAMS+=" -p bt_predict_delta=${{ github.event.inputs.bt_predict_delta }}"
            [ -n "${{ github.event.inputs.bt_predict_percentile }}" ] && PARAMS+=" -p bt_predict_percentile=${{ github.event.inputs.bt_predict_percentile }}"
            [ -n "${{ github.event.inputs.bt_organize_vote }}" ] && PARAMS+=" -p bt_organize_vote=${{ github.event.inputs.bt_organize_vote }}"
            [ -n "${{ github.event.inputs.bt_use_mlflow }}" ] && PARAMS+=" -p bt_use_mlflow=${{ github.event.inputs.bt_use_mlflow }}"
            [ -n "${{ github.event.inputs.bt_version }}" ] && PARAMS+=" -p bt_version=${{ github.event.inputs.bt_version }}"

            # Explainer params
            [ -n "${{ github.event.inputs.ex_model_version }}" ] && PARAMS+=" -p ex_model_version=${{ github.event.inputs.ex_model_version }}"
            [ -n "${{ github.event.inputs.ex_years }}" ] && PARAMS+=" -p ex_years=${{ github.event.inputs.ex_years }}"
            [ -n "${{ github.event.inputs.ex_types }}" ] && PARAMS+=" -p ex_types=${{ github.event.inputs.ex_types }}"
            [ -n "${{ github.event.inputs.ex_vars }}" ] && PARAMS+=" -p ex_vars=${{ github.event.inputs.ex_vars }}"
            [ -n "${{ github.event.inputs.ex_data_path }}" ] && PARAMS+=" -p ex_data_path=${{ github.event.inputs.ex_data_path }}"
            [ -n "${{ github.event.inputs.ex_steps }}" ] && PARAMS+=" -p ex_steps=${{ github.event.inputs.ex_steps }}"

            # Credentials
            PARAMS+=" -p aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}"
            PARAMS+=" -p aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            PARAMS+=" -p mlflow_username=${{ secrets.MLFLOW_USERNAME }}"
            PARAMS+=" -p mlflow_password=${{ secrets.MLFLOW_PASSWORD }}"

            argo submit .argo/train_explain.yaml $PARAMS --watch
