
name: Build and Deploy Electera

on:
  push:
    branches:
      - main
    paths-ignore:
      - deployment/**

permissions:
  contents: write

concurrency:
  group: electera-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: electera
            dockerfile: Dockerfile
          - image: electera-api
            dockerfile: Dockerfile.api
          - image: electera-app
            dockerfile: Dockerfile.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: |
            arthurmanceau/${{ matrix.image }}:${{ github.sha }}
            arthurmanceau/${{ matrix.image }}:latest

  update-manifests:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Kubernetes image tags
        run: |
          sed -i "s|arthurmanceau/electera-api:.*|arthurmanceau/electera-api:${GITHUB_SHA}|" deployment/deployment.yaml
          sed -i "s|arthurmanceau/electera-app:.*|arthurmanceau/electera-app:${GITHUB_SHA}|" deployment/app.yaml

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/
          git diff --cached --quiet && exit 0
          git commit -m "chore(deploy): update images to ${GITHUB_SHA}"
          git push
