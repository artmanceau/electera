name: Build & Push Docker Image

# ────── Trigger ──────
on:
    push:
      branches: [main]                # ✔  runs on every push to main
    workflow_dispatch:               # ⚙️   also allows manual triggers

# ────── Jobs ──────
jobs:
    build_and_push:
      runs-on: ubuntu-latest
      environment: production       # optional – set the env where the image will live

      steps:
        # 1️⃣  Checkout the repository
        - name: Checkout repository
          uses: actions/checkout@v4

        # 2️⃣  Cache Docker layers (speed‑up repeated builds)
        - name: Cache Docker layers
          uses: actions/cache@v3
          with:
            path: /tmp/.buildx-cache
            key: ${{ runner.os }}-docker-${{ hashFiles('**/Dockerfile') }}
            restore-keys: ${{ runner.os }}-docker-

        # 3️⃣  Set up Docker Buildx
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        # 4️⃣  Log in to the registry
        #    ⬇️   Use the secrets we created in step 1
        - name: Log in to Docker registry
          uses: docker/login-action@v3
          with:
            registry: ${{ env.REGISTRY_URL }}
            username: ${{ secrets.REGISTRY_USER }}
            password: ${{ secrets.REGISTRY_PASS }}

        # 5️⃣  Build & push the image
        - name: Build and push Docker image
          uses: docker/build-push-action@v5
          with:
            # Context is the repo root
            context: .
            # If you have a custom Dockerfile name, set `file: path/to/Dockerfile`
            file: Dockerfile
            # Push the image to the registry
            push: true
            # Tag it with the commit SHA so you can always trace it back
            tags: |
              ${{ env.REGISTRY_URL }}/${{ secrets.IMAGE_NAME }}:${{ github.sha }}